AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Portfolio Chatbot Assistant - AWS CI/CD and runtime stack.
  Backend: Spring Boot container on ECS Fargate fronted by an Application Load
  Balancer, PostgreSQL 16 on RDS with pgvector. Frontend: Angular build served
  from S3 through CloudFront (shared-domain /api/* routing to the ALB).
  CI/CD: AWS CodePipeline + CodeBuild (GitHub via CodeStar Connections).

Parameters:
  EnvironmentName:
    Type: String
    Default: prod
    Description: Environment name used in resource names and tags.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC that will host the ALB, ECS and RDS resources.
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least 2 public subnets for the Application Load Balancer.
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least 2 private subnets for ECS tasks and RDS.
  MistralApiKey:
    Type: String
    NoEcho: true
    Description: Mistral AI API key, stored in AWS Secrets Manager.
  GitHubConnectionArn:
    Type: String
    Description: >
      ARN of an existing CodeStar Connections connection to GitHub
      (CodePipeline console -> Settings -> Connections).
  GitHubOwner:
    Type: String
    Description: GitHub user/organization that owns the repository.
  GitHubRepo:
    Type: String
    Description: GitHub repository name.
  GitHubBranch:
    Type: String
    Default: master
    Description: Branch the pipeline watches for changes.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: "Environment & Network" }
        Parameters: [EnvironmentName, VpcId, PublicSubnetIds, PrivateSubnetIds]
      - Label: { default: "Application Secrets" }
        Parameters: [MistralApiKey]
      - Label: { default: "GitHub Source" }
        Parameters: [GitHubConnectionArn, GitHubOwner, GitHubRepo, GitHubBranch]

Resources:
  # ---------------------------------------------------------------------------
  # Container registry
  # ---------------------------------------------------------------------------
  ChatbotEcrRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: portfolio-chatbot
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: MUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Retain last 10 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": { "type": "expire" }
              }
            ]
          }

  # ---------------------------------------------------------------------------
  # Secrets (referenced via partial ARN by the ECS task at runtime)
  # ---------------------------------------------------------------------------
  ChatbotDbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: portfolio-chatbot-db-credentials
      Description: RDS PostgreSQL credentials for the portfolio chatbot.
      GenerateSecretString:
        SecretStringTemplate: '{"username":"chatbot"}'
        GenerateStringKey: password
        ExcludePunctuation: true
        PasswordLength: 24

  MistralApiSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: portfolio-chatbot-mistral-api-key
      Description: Mistral AI API key.
      SecretString: !Sub '{"MISTRAL_API_KEY":"${MistralApiKey}"}'

  # ---------------------------------------------------------------------------
  # Database (PostgreSQL + pgvector)
  # ---------------------------------------------------------------------------
  ChatbotDbParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Family: postgres16
      Description: PostgreSQL parameter group with pgvector enabled.
      Parameters:
        shared_preload_libraries: vector

  ChatbotDbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for the portfolio chatbot database.
      SubnetIds: !Ref PrivateSubnetIds

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow PostgreSQL access from ECS tasks only.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref EcsSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

  ChatbotDb:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    Properties:
      DBInstanceIdentifier: portfolio-chatbot
      Engine: postgresql
      EngineVersion: "16.8"
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: 20
      StorageType: gp3
      StorageEncrypted: true
      DBName: portfolio_chatbot
      MasterUsername: !Sub '{{resolve:secretsmanager:${ChatbotDbSecret}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${ChatbotDbSecret}:SecretString:password}}'
      DBParameterGroupName: !Ref ChatbotDbParameterGroup
      DBSubnetGroupName: !Ref ChatbotDbSubnetGroup
      VPCSecurityGroups:
        - !Ref DbSecurityGroup
      MultiAZ: false
      PubliclyAccessible: false
      AutoMinorVersionUpgrade: true
      BackupRetentionPeriod: 7
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  # ---------------------------------------------------------------------------
  # Load balancer
  # ---------------------------------------------------------------------------
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP access to the chat application.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

  ChatbotLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: portfolio-chatbot-alb
      Type: application
      Scheme: internet-facing
      Subnets: !Ref PublicSubnetIds
      SecurityGroups:
        - !Ref ALBSecurityGroup
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  ChatbotTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: portfolio-chatbot-tg
      TargetType: ip
      Protocol: HTTP
      Port: 8080
      VpcId: !Ref VpcId
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPath: /api/health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"

  ChatbotHttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ChatbotLoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ChatbotTargetGroup

  # ---------------------------------------------------------------------------
  # ECS Fargate
  # ---------------------------------------------------------------------------
  EcsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow traffic from the load balancer to ECS tasks.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref ALBSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: portfolio-chatbot
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  EcsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/portfolio-chatbot
      RetentionInDays: 7

  EcsExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: portfolio-chatbot-execution-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
      Policies:
        - PolicyName: EcsExecutionPermissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt EcsLogGroup.Arn
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:portfolio-chatbot-db-credentials-*'
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:portfolio-chatbot-mistral-api-key-*'

  EcsTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: portfolio-chatbot-task-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole

  EcsTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: portfolio-chatbot
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: "512"
      Memory: "1024"
      ExecutionRoleArn: !GetAtt EcsExecutionRole.Arn
      TaskRoleArn: !GetAtt EcsTaskRole.Arn
      ContainerDefinitions:
        - Name: portfolio-chatbot
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ChatbotEcrRepo}:latest'
          Essential: true
          Cpu: 0
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          Environment:
            - Name: DB_URL
              Value: !Sub 'jdbc:postgresql://${ChatbotDb.Endpoint.Address}:${ChatbotDb.Endpoint.Port}/portfolio_chatbot'
            - Name: CORS_ALLOWED_ORIGINS
              Value: !Sub 'https://${ChatbotDistribution.DomainName}'
            - Name: SHOW_SQL
              Value: "false"
          Secrets:
            - Name: DB_USERNAME
              ValueFrom: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:portfolio-chatbot-db-credentials:SecretString:username::'
            - Name: DB_PASSWORD
              ValueFrom: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:portfolio-chatbot-db-credentials:SecretString:password::'
            - Name: MISTRAL_API_KEY
              ValueFrom: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:portfolio-chatbot-mistral-api-key:SecretString:MISTRAL_API_KEY::'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref EcsLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: chatbot

  EcsService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: portfolio-chatbot
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref EcsTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Ref PrivateSubnetIds
          SecurityGroups:
            - !Ref EcsSecurityGroup
      LoadBalancers:
        - ContainerName: portfolio-chatbot
          ContainerPort: 8080
          TargetGroupArn: !Ref ChatbotTargetGroup

  # ---------------------------------------------------------------------------
  # Frontend: S3 + CloudFront (S3 default origin, /api/* routed to the ALB)
  # ---------------------------------------------------------------------------
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  ChatbotOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: portfolio-chatbot-s3-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${ChatbotDistribution}'

  ChatbotDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        Origins:
          - Id: s3-frontend
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessControlId: !Ref ChatbotOriginAccessControl
          - Id: api-backend
            DomainName: !GetAtt ChatbotLoadBalancer.DNSName
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: http-only
              OriginSSLProtocols:
                - TLSv1.2
            OriginReadTimeout: 120
            OriginConnectTimeout: 5
        DefaultCacheBehavior:
          TargetOriginId: s3-frontend
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
          MinTTL: 0
          DefaultTTL: 3600
          MaxTTL: 86400
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api-backend
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - POST
              - PATCH
              - DELETE
            ForwardedValues:
              QueryString: true
              Headers:
                - Accept
                - Authorization
                - Origin
                - X-Session-ID
              Cookies:
                Forward: all
            MinTTL: 0
            DefaultTTL: 0
            MaxTTL: 0
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  # ---------------------------------------------------------------------------
  # CI/CD: CodeBuild projects + CodePipeline
  # ---------------------------------------------------------------------------
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: portfolio-chatbot-codebuild-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodeBuildPermissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                Resource: !Sub 'arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/portfolio-chatbot'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:GetBucketLocation
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub '${ArtifactBucket}/*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt FrontendBucket.Arn
                  - !Sub '${FrontendBucket}/*'
              - Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                Resource: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${ChatbotDistribution}'
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
              - Effect: Allow
                Action:
                  - sts:GetCallerIdentity
                Resource: "*"

  ChatbotBackendProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: portfolio-chatbot-backend-build
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: REPOSITORY_URI
            Value: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ChatbotEcrRepo}'
          - Name: ECS_CONTAINER_NAME
            Value: portfolio-chatbot
          - Name: ECS_TASK_EXECUTION_ROLE_ARN
            Value: !GetAtt EcsExecutionRole.Arn
          - Name: ECS_TASK_ROLE_ARN
            Value: !GetAtt EcsTaskRole.Arn
          - Name: DB_URL
            Value: !Sub 'jdbc:postgresql://${ChatbotDb.Endpoint.Address}:${ChatbotDb.Endpoint.Port}/portfolio_chatbot'
          - Name: CORS_ALLOWED_ORIGINS
            Value: !Sub 'https://${ChatbotDistribution.DomainName}'
          - Name: LOG_GROUP
            Value: /ecs/portfolio-chatbot
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec-backend.yml
      TimeoutInMinutes: 30
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  ChatbotFrontendProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: portfolio-chatbot-frontend-build
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        EnvironmentVariables:
          - Name: S3_BUCKET_NAME
            Value: !Ref FrontendBucket
          - Name: CLOUDFRONT_DISTRIBUTION_ID
            Value: !Ref ChatbotDistribution
          - Name: API_BASE_URL
            Value: !Sub 'https://${ChatbotDistribution.DomainName}/api'
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec-frontend.yml
      TimeoutInMinutes: 30
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  CodePipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: portfolio-chatbot-codepipeline-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ArtifactStoreAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:GetBucketLocation
                  - s3:PutObject
                  - s3:PutObjectAcl
                  - s3:ListBucket
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub '${ArtifactBucket}/*'
        - PolicyName: CodeBuildAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:StopBuild
                  - codebuild:BatchGetBuilds
                Resource: "*"
        - PolicyName: EcsDeployAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ecs:DescribeClusters
                  - ecs:DescribeServices
                  - ecs:DescribeTaskDefinition
                  - ecs:RegisterTaskDefinition
                  - ecs:UpdateService
                Resource: "*"
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  - !GetAtt EcsExecutionRole.Arn
                  - !GetAtt EcsTaskRole.Arn
        - PolicyName: CodeStarConnectionAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - codestar-connections:UseConnection
                  - codestar-connections:PassConnectionToCodePipeline
                Resource: !Ref GitHubConnectionArn

  ChatbotPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: portfolio-chatbot-pipeline
      RoleArn: !GetAtt CodePipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:
        - Name: Source
          Actions:
            - Name: Source
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: "1"
              Configuration:
                ConnectionArn: !Ref GitHubConnectionArn
                FullRepositoryId: !Sub '${GitHubOwner}/${GitHubRepo}'
                BranchName: !Ref GitHubBranch
                OutputArtifactFormat: CODE_ZIP
              OutputArtifacts:
                - Name: SourceOutput
        - Name: Build
          Actions:
            - Name: BackendBuild
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref ChatbotBackendProject
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: BackendBuildOutput
              RunOrder: 1
            - Name: FrontendBuild
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref ChatbotFrontendProject
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: FrontendBuildOutput
              RunOrder: 1
        - Name: Deploy
          Actions:
            - Name: DeployBackend
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: ECS
                Version: "1"
              Configuration:
                ClusterName: portfolio-chatbot
                ServiceName: portfolio-chatbot
                FileName: imagedefinitions.json
                DeploymentTimeout: "60"
                TaskDefinitionTemplateArtifact: BackendBuildOutput
                TaskDefinitionTemplatePath: taskdef.json
              InputArtifacts:
                - Name: BackendBuildOutput

Outputs:
  CloudFrontUrl:
    Description: Public URL of the application.
    Value: !Sub 'https://${ChatbotDistribution.DomainName}'
  ApiBaseUrl:
    Description: Public API base URL consumed by the Angular app.
    Value: !Sub 'https://${ChatbotDistribution.DomainName}/api'
  LoadBalancerDns:
    Description: ALB DNS name (backend origin behind CloudFront).
    Value: !GetAtt ChatbotLoadBalancer.DNSName
  DatabaseEndpoint:
    Description: RDS PostgreSQL endpoint.
    Value: !GetAtt ChatbotDb.Endpoint.Address
  EcrRepositoryUri:
    Description: Backend container image repository.
    Value: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ChatbotEcrRepo}'
  PipelineName:
    Description: CodePipeline triggered by pushes to the configured branch.
    Value: !Ref ChatbotPipeline